<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F3A" flood-opacity=".14"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0D62B3"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F8F98"/>
    </marker>
    <style>
      .card{fill:#fff;stroke:#D3DEEA;stroke-width:1.5}
      .stage{fill:#fff;stroke:#C9D8E8;stroke-width:1.5}
      .h{font:700 25px Arial,sans-serif;fill:#0B1F3A}
      .sub{font:500 16px Arial,sans-serif;fill:#5B6E82}
      .lbl{font:700 20px Arial,sans-serif;fill:#fff}
      .cap{font:500 15px Arial,sans-serif;fill:#5B6E82}
      .flow{stroke:#0D62B3;stroke-width:3;fill:none;marker-end:url(#arr)}
      .ret{stroke:#0F8F98;stroke-width:3;fill:none;stroke-dasharray:2 6;marker-end:url(#arr2)}
      .tt{font:700 14px Arial,sans-serif;fill:#0D62B3}
      .tt2{font:700 14px Arial,sans-serif;fill:#0F8F98}
      .foot{font:700 15px Arial,sans-serif;fill:#102033}
      .footcap{font:500 12px Arial,sans-serif;fill:#5B6E82}
    </style>
  </defs>

  <rect width="1800" height="900" fill="#F7FAFC"/>

  <text x="60" y="66" class="h">Real-Time Voice Booking Agent</text>
  <text x="60" y="96" class="sub">NVIDIA PersonaPlex + Nemotron — streaming voice in, transaction out</text>

  <!-- pipeline stages -->
  <g transform="translate(60 140)">
    <!-- 1 caller -->
    <rect width="240" height="180" rx="20" class="stage" filter="url(#sh)"/>
    <rect width="240" height="56" rx="20" fill="#0B3B75"/>
    <rect y="36" width="240" height="20" fill="#0B3B75"/>
    <text x="26" y="38" class="lbl">Caller</text>
    <text x="26" y="96" class="cap">Phone · WebRTC · mobile</text>
    <text x="26" y="126" class="cap">Live audio, barge-in</text>
    <text x="26" y="152" class="cap">capable channel</text>

    <path d="M240 90 L300 90" class="flow"/>

    <!-- 2 realtime -->
    <g transform="translate(300 0)">
      <rect width="300" height="180" rx="20" class="stage" filter="url(#sh)"/>
      <rect width="300" height="56" rx="20" fill="#0F7D88"/>
      <rect y="36" width="300" height="20" fill="#0F7D88"/>
      <text x="26" y="38" class="lbl">PersonaPlex Session</text>
      <text x="26" y="96" class="cap">Streaming audio I/O</text>
      <text x="26" y="122" class="cap">VAD + turn-taking</text>
      <text x="26" y="148" class="cap">Incremental ASR transcript</text>
    </g>

    <path d="M600 90 L660 90" class="flow"/>

    <!-- 3 reasoning -->
    <g transform="translate(660 0)">
      <rect width="300" height="180" rx="20" class="stage" filter="url(#sh)"/>
      <rect width="300" height="56" rx="20" fill="#0F8F98"/>
      <rect y="36" width="300" height="20" fill="#0F8F98"/>
      <text x="26" y="38" class="lbl">Nemotron</text>
      <text x="26" y="96" class="cap">Intent capture + dialogue state</text>
      <text x="26" y="122" class="cap">Response planning</text>
      <text x="26" y="148" class="cap">Guardrails + policy</text>
    </g>

    <path d="M960 90 L1020 90" class="flow"/>

    <!-- 4 controller -->
    <g transform="translate(1020 0)">
      <rect width="300" height="180" rx="20" class="stage" filter="url(#sh)"/>
      <rect width="300" height="56" rx="20" fill="#0D62B3"/>
      <rect y="36" width="300" height="20" fill="#0D62B3"/>
      <text x="26" y="38" class="lbl">Booking Controller</text>
      <text x="26" y="96" class="cap">Availability + customer lookup</text>
      <text x="26" y="122" class="cap">Pricing + rules validation</text>
      <text x="26" y="148" class="cap">Reservation + payment</text>
    </g>

    <path d="M1320 90 L1380 90" class="flow"/>

    <!-- 5 enterprise -->
    <g transform="translate(1380 0)">
      <rect width="300" height="180" rx="20" class="stage" filter="url(#sh)"/>
      <rect width="300" height="56" rx="20" fill="#113A68"/>
      <rect y="36" width="300" height="20" fill="#113A68"/>
      <text x="26" y="38" class="lbl">Enterprise Systems</text>
      <text x="26" y="96" class="cap">Booking engine + calendar</text>
      <text x="26" y="122" class="cap">CRM + payments</text>
      <text x="26" y="148" class="cap">Notifications + audit log</text>
    </g>

    <!-- return path: TTS response back to caller -->
    <path d="M1530 180 L1530 230 L120 230 L120 180" class="ret"/>
    <text x="700" y="222" class="tt2">spoken confirmation — TTS response streamed back to caller</text>
  </g>

  <!-- operational trust strip -->
  <g transform="translate(60 420)">
    <rect width="1620" height="130" rx="20" fill="#EFF7FA" stroke="#B9D6E2"/>
    <text x="30" y="34" class="foot" font-size="19">Operational trust layer</text>
    <text x="30" y="58" class="footcap">The voice UX is judged by more than the model — these six signals carry the perceived quality.</text>
    <g transform="translate(30 74)">
      <g><rect width="240" height="42" rx="10" class="card"/><text x="16" y="27" class="foot">Tracing</text></g>
      <g transform="translate(260 0)"><rect width="240" height="42" rx="10" class="card"/><text x="16" y="27" class="foot">Latency (ASR/LLM/TTS)</text></g>
      <g transform="translate(520 0)"><rect width="240" height="42" rx="10" class="card"/><text x="16" y="27" class="foot">Observability</text></g>
      <g transform="translate(780 0)"><rect width="240" height="42" rx="10" class="card"/><text x="16" y="27" class="foot">Least-privilege security</text></g>
      <g transform="translate(1040 0)"><rect width="240" height="42" rx="10" class="card"/><text x="16" y="27" class="foot">Low-confidence fallback</text></g>
      <g transform="translate(1300 0)"><rect width="240" height="42" rx="10" class="card"/><text x="16" y="27" class="foot">Task-success evaluation</text></g>
    </g>
  </g>

  <!-- experiment framing -->
  <g transform="translate(60 580)">
    <rect width="1620" height="150" rx="20" fill="#fff" stroke="#B5C7DC" filter="url(#sh)"/>
    <text x="30" y="38" class="foot" font-size="19">Why it exists</text>
    <text x="30" y="66" class="footcap">A narrower, controlled counterpart to VitalForce — same latency and turn-taking discipline,</text>
    <text x="30" y="88" class="footcap">a simpler embodiment layer, useful for isolating model quality from real-time engineering quality.</text>
    <rect x="30" y="104" width="330" height="30" rx="15" fill="#0F7D88"/>
    <text x="48" y="124" font="700 14px Arial,sans-serif" fill="#fff">no scripted IVR tree, anywhere</text>
  </g>
</svg>

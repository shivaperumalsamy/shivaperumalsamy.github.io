<script>
/* The Drive player is cross-origin, so the page can't see "play". A click into it moves focus
   to the iframe and blurs the window — that is logged once as a play by the analytics Worker. */
(function(){
  var frame = document.querySelector('.video iframe');
  var sent = {};
  function log(event){
    if(sent[event]) return; sent[event] = true;
    try { navigator.sendBeacon('/_event', event); } catch(e) {}
  }
  addEventListener('blur', function(){
    setTimeout(function(){ if(document.activeElement === frame) log('play'); }, 0);
  });
  document.getElementById('driveLink').addEventListener('click', function(){ log('drive'); });
})();
</script>
